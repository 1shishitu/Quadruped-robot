# 运动控制全局配置 — unitree_guide 管线
#
# 步态/控制器专用参数 → config/gait_config/<name>.yaml 的 control:
#   fl_lift.yaml  — 单腿抬升
#   march.yaml    — 原地踏步 (mode: march_in_place)
#   trot.yaml     — 行走 (mode: walk)
#
locomotion:
  enabled: true
  mode: fl_lift               # fl_lift | march_in_place | walk
  gait_config: fl_lift         # → config/gait_config/*.yaml
  toggle_key: "8"
  stop_key: END

  keys:
    forward: UP
    back: DOWN
    strafe_left: LEFT
    strafe_right: RIGHT
    yaw_left: INSERT
    yaw_right: DELETE

  max_vx: 0.25                 # 硬上限 [m/s]
  max_vy: 0.15
  max_omega: 0.6

  cmd_vx: 0.15                 # 按住方向键时的目标巡航速度
  cmd_vy: 0.10
  cmd_omega: 0.35

  smoothing_tau: 0.12           # 加减速时间常数 [s]
  key_mode: remote
  key_hold_timeout: 0.12        # 仅 key_mode: repeat 时使用

  # Balance 默认 trunk PD（各步态可在 gait control.trunk 覆盖）
  trunk:
    default_height: 0.28
    preview_horizon: 0.06
    kp_pos: [18.0, 18.0, 45.0]
    kd_pos: [10.0, 10.0, 8.0]
    kp_rpy: [35.0, 35.0, 10.0]
    kd_rpy: [4.0, 4.0, 2.5]

  balance:
    include_gravity: true
    v_cmd_deadband: 0.04
    friction_coeff: 0.4
    com_offset: [0.0, 0.0, 0.0]
    alpha: 0.001
    beta: 0.1
    weight_wrench: [20.0, 20.0, 50.0, 450.0, 450.0, 450.0]
    weight_force: [10.0, 10.0, 4.0]
    weight_smooth: [3.0, 3.0, 3.0]
    inertia: [0.0792, 0.2085, 0.2265]

  wbc:
    joint_kd: [2.0, 2.0, 2.0]
    gravity_compensation: true

  swing_ik:
    max_iters: 12
    damping: 0.08
    tol: 0.0001

  debug_viz:
    enabled: true
    show_swing_path: true
    show_raibert: true
