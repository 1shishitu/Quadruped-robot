# 推荐环境：仿真 + 动力学 + MPC（Phase 0~5）
# 用法: conda env create -f environment.yml

name: quadruped
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=1.24
  - scipy>=1.10
  - pyyaml>=6.0
  - pytest>=7.0
  # 仿真与可视化
  - mujoco>=3.0
  - meshcat-python
  # 动力学（WBC / 雅可比）
  - pinocchio>=3.0
  - pip
  - pip:
      # MPC QP 求解器（conda-forge 也有 osqp，pip 通常更新）
      - osqp>=0.6
      # 可选：原型阶段快速验证 QP
      - cvxpy>=1.4
